# Redis configuration for AKIHO

# Network
bind 0.0.0.0
protected-mode no
port 6379

# General
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# Persistence
dir /data
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Security (disabled for Docker)
# requirepass yourpassword

# Performance
timeout 0
tcp-keepalive 300
