<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟生命体 - 镜野与星辰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f4f9fa 0%, #e0f2f5 50%, #eff5f7 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.05);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 2px rgba(45, 164, 168, 0.2), inset 0 1px 2px rgba(0,0,0,0.01);
            outline: none;
        }

        .ambient-glow {
            position: absolute;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(167,216,222,0.3) 0%, rgba(255,255,255,0) 60%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            animation: float 10s infinite ease-in-out alternate;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(3vw, 2vh) scale(1.05); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(45, 164, 168, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(45, 164, 168, 0.3); }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative text-slate-700">

    <!-- 动态背景光效 (调整了光效的位置以适应反转的布局) -->
    <div class="ambient-glow top-[-20%] left-[-10%]"></div>
    <div class="ambient-glow bottom-[-20%] right-[-10%]" style="animation-delay: -5s;"></div>

    <!-- Live2D 模型渲染层 (改为空出右侧，靠左渲染) -->
    <div id="live2d-layer" class="absolute inset-0 z-0 pointer-events-none flex items-end justify-start pl-32 pb-0">
        <div class="w-[500px] h-[800px] border border-dashed border-teal-200/40 rounded-t-[4rem] flex flex-col items-center justify-center text-teal-600/30 relative bg-gradient-to-t from-teal-50/20 to-transparent backdrop-blur-[2px]">
            <svg class="w-16 h-16 mb-4 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <span class="text-lg font-light tracking-[0.2em]">Live2D 渲染空间</span>
            <span class="text-xs mt-3 opacity-60 tracking-wider">将渲染在页面左侧</span>
        </div>
    </div>

    <!-- 前景：交互式 UI 层 (改为空出左侧，UI靠右) -->
    <main class="w-full h-full max-w-[1400px] mx-auto flex items-center justify-end p-12 z-10 pointer-events-none">
        
        <section class="glass-panel w-full max-w-[420px] h-[82vh] rounded-[2.5rem] flex flex-col relative pointer-events-auto overflow-hidden shadow-[-10px_12px_40px_rgba(31,38,135,0.03)]">
            
            <header class="p-6 pb-4 flex justify-between items-start bg-gradient-to-b from-white/40 to-transparent">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-teal-50 to-white flex items-center justify-center text-teal-500 shadow-sm border border-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-semibold text-slate-800 tracking-wide">秋穗 Akiho</h1>
                        <p class="text-[11px] text-teal-600/70 font-medium tracking-widest mt-1">镜野的守望者</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 mt-2">
                    <span class="text-[10px] text-slate-400 font-mono">SYNC</span>
                    <div class="w-1.5 h-1.5 rounded-full bg-teal-400 shadow-[0_0_8px_rgba(45,164,168,0.8)] animate-pulse"></div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto px-6 py-2 flex flex-col gap-6" id="chat-stream">
                <div class="flex gap-3 max-w-[88%] msg-ai">
                    <div class="bg-white/80 backdrop-blur-md p-4 px-5 rounded-3xl rounded-tl-sm border border-white text-[14px] leading-relaxed shadow-[0_2px_10px_rgba(0,0,0,0.02)] text-slate-600">
                        水面的波纹平静下来了。<br>今天想要一起看星星，还是听听稻穗摇曳的声音？
                    </div>
                </div>

                <div class="flex gap-3 max-w-[88%] self-end flex-row-reverse msg-user">
                    <div class="bg-teal-500/90 backdrop-blur-md text-white p-4 px-5 rounded-3xl rounded-tr-sm shadow-[0_4px_15px_rgba(45,164,168,0.2)] text-[14px] leading-relaxed font-light">
                        我想看看你现在的动作表现系统是如何运作的。
                    </div>
                </div>

                 <div class="flex gap-3 max-w-[88%] msg-ai">
                    <div class="bg-white/80 backdrop-blur-md p-4 px-5 rounded-3xl rounded-tl-sm border border-white text-[14px] leading-relaxed shadow-[0_2px_10px_rgba(0,0,0,0.02)] text-slate-600">
                        <span class="inline-block px-2 py-0.5 rounded-full bg-teal-50 text-teal-500 text-[10px] font-mono mb-2 border border-teal-100">Motion: Look_Up_Smile</span><br>
                        没问题，我已经准备好随时响应你的指令了。
                    </div>
                </div>
            </div>

            <footer class="p-6 pt-2 bg-gradient-to-t from-white/60 via-white/40 to-transparent">
                <div class="relative flex items-center group">
                    <input type="text" placeholder="与 秋穗 交流..." class="glass-input w-full rounded-2xl py-4 pl-6 pr-14 text-[14px] text-slate-700 placeholder-slate-400">
                    <button class="absolute right-2 p-2.5 rounded-xl text-teal-500 hover:bg-teal-50 hover:text-teal-600 transition-all duration-300 transform group-hover:scale-105">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg>
                    </button>
                </div>
            </footer>
        </section>
    </main>

    <script>
        gsap.from(".ambient-glow", {
            opacity: 0,
            scale: 0.8,
            duration: 2,
            ease: "power2.out"
        });

        // 对话框入场动画，改为从右侧略微滑入
        gsap.from(".glass-panel", {
            x: 30,
            opacity: 0,
            duration: 1.2,
            ease: "expo.out",
            delay: 0.2
        });
        
        gsap.from(".msg-ai, .msg-user", {
            y: 15,
            opacity: 0,
            duration: 0.8,
            stagger: 0.15,
            ease: "back.out(1.2)",
            delay: 0.6
        });
    </script>
</body>
</html>
