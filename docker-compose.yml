# AKIHO Docker Compose Configuration
# Single-command deployment for development and production

services:
  # ============== Main Application ==============
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akiho-app
    ports:
      - "8000:8000"    # FastAPI
      - "3000:3000"    # Frontend (if served by app)
    environment:
      # Database
      - DATABASE_URL=postgresql://akiho:akiho_secret@postgres:5432/akiho
      - REDIS_URL=redis://redis:6379/0

      # LLM API Keys (set in .env or here)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}

      # App Settings
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=INFO

      # CORS
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000

    volumes:
      # Persist data
      - akiho-data:/app/data
      # Mount config file (read-write for settings persistence)
      - ./config.json:/app/config.json
      # Mount web source for development
      - ./web:/app/web:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - akiho-network

  # ============== Frontend (Development) ==============
  frontend:
    image: node:20-alpine
    container_name: akiho-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://app:8000
      - VITE_WS_BASE=ws://app:8000
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - akiho-network

  # ============== PostgreSQL Database ==============
  postgres:
    image: postgres:16-alpine
    container_name: akiho-postgres
    environment:
      - POSTGRES_USER=akiho
      - POSTGRES_PASSWORD=akiho_secret
      - POSTGRES_DB=akiho
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Initialize database
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akiho -d akiho"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - akiho-network

  # ============== Redis Cache ==============
  redis:
    image: redis:7-alpine
    container_name: akiho-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      # Redis config
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - akiho-network

# ============== Volumes ==============
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  akiho-data:
    driver: local

# ============== Networks ==============
networks:
  akiho-network:
    driver: bridge
